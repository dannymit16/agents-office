<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="המשרד">
<meta name="theme-color" content="#0d0f1e">
<title>המשרד של הסוכנים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{--bg:#0d0f1e;--panel:#161a33;--line:#2a3160;--txt:#e7e9ff;--mut:#9aa0c8;--acc:#fbbf24;--good:#4ade80;--bad:#f87171;
        --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Rubik,system-ui,sans-serif;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%;padding-top:var(--st)}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px}
  header h1{font-size:17px;margin:0;font-weight:800}
  .dot{width:9px;height:9px;border-radius:50%;background:#555}
  .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
  .tag{font-family:'Press Start 2P';font-size:7px;background:var(--acc);color:#111;padding:4px 6px;border-radius:3px}
  .clk{margin-inline-start:auto;font-family:'Press Start 2P';font-size:10px;color:#86efac}
  main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .view{display:none;padding:0 12px 16px}
  .view.on{display:block}
  nav{display:flex;border-top:2px solid var(--line);background:#0b0d1a;padding-bottom:var(--sb)}
  nav button{flex:1;background:none;border:0;color:var(--mut);font:600 11px Rubik;padding:8px 0 6px;position:relative}
  nav button span{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}
  nav .badge{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;display:none}
  .stage{border:3px solid #000;outline:2px solid var(--line);border-radius:6px;overflow:auto;background:#000;position:relative}
  .stage canvas{display:block;image-rendering:pixelated;width:100%}
  .stage.zoom canvas{width:175%}
  .zbtn{position:absolute;top:6px;left:6px;background:#000a;color:#fff;border:1px solid #fff4;border-radius:6px;font-size:13px;padding:4px 8px;z-index:2}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
  .card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
  .pnl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
  .pnl div{background:#0f1330;border-radius:8px;padding:7px 2px}
  .pnl span{display:block;font-size:10px;color:var(--mut)}
  .pnl b{display:block;font-size:14px;margin-top:3px;direction:ltr}
  .pnl .profit{outline:2px solid currentColor}
  .goal{margin-top:10px;font-size:12px;color:var(--mut)}
  .bar{height:12px;background:#0f1330;border-radius:8px;overflow:hidden;margin:6px 0;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#4ade80);width:0}
  .bar i.pace{position:relative}
  .agents{display:grid;grid-template-columns:1fr;gap:6px}
  .ag{display:flex;align-items:center;gap:10px;background:#0f1330;border-radius:8px;padding:8px}
  .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:3px solid;flex:none}
  .ag .nm{font-weight:800;font-size:13px}
  .ag .ac{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
  .st{margin-inline-start:auto;font-size:11px;padding:3px 8px;border-radius:20px;flex:none}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:5px 3px;border-bottom:1px solid #222850;text-align:right}
  th{color:var(--mut);font-weight:600}
  td.n{direction:ltr;text-align:left}
  /* chat */
  #view-chat{display:none;flex-direction:column;height:100%;padding:0}
  #view-chat.on{display:flex}
  #msgs{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .m.danny{align-self:flex-start;background:#3b2f0a;border:1px solid #7c5d0f;border-bottom-right-radius:3px}
  .m.manager{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
  .m.question{border:2px solid var(--acc)}
  .m.report{border:2px solid #8b5cf6}
  .m time{display:block;font-size:10px;color:var(--mut);margin-top:4px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chips button{background:#0f1330;border:1px solid var(--acc);color:var(--acc);border-radius:14px;padding:4px 10px;font:600 12px Rubik}
  .typing{align-self:flex-end;color:var(--mut);font-size:13px;display:none}
  .composer{display:flex;gap:8px;padding:8px 12px;border-top:2px solid var(--line);background:#0b0d1a}
  .composer textarea{flex:1;resize:none;background:var(--panel);color:var(--txt);border:2px solid var(--line);border-radius:12px;padding:9px;font:15px Rubik;max-height:120px}
  .composer button{background:var(--acc);border:0;border-radius:12px;font-size:18px;width:46px}
  .feed div.row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #222850;font-size:13px;line-height:1.45}
  .feed time{font-family:'Press Start 2P';font-size:8px;color:var(--acc);padding-top:4px;flex:none}
  .feed .msg{color:#c4b5fd}
  .seg{display:flex;gap:6px;margin:10px 0}
  .seg button{flex:1;background:var(--panel);color:var(--mut);border:2px solid var(--line);border-radius:8px;padding:6px;font:600 12px Rubik}
  .seg button.on{color:#111;background:var(--acc);border-color:var(--acc)}
  .task{background:#0f1330;border-radius:8px;padding:8px;margin-top:6px;font-size:13px}
  .task small{color:var(--mut);display:block;margin-top:3px}
  /* login */
  #login{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;padding:24px;z-index:9}
  #login .box{width:100%;max-width:340px;text-align:center}
  #login input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--txt);font:16px Rubik;margin:8px 0;text-align:center;direction:ltr}
  #login button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);font:800 16px Rubik}
  .err{color:var(--bad);font-size:13px;min-height:18px}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="app">
  <header><h1>🏢 המשרד</h1><span class="dot" id="dot"></span><span class="tag" id="demoTag" style="display:none">DEMO</span><span class="clk" id="clk"></span></header>
  <main>
    <section class="view on" id="view-office">
      <div class="stage" id="stage" dir="ltr"><button class="zbtn" id="zoom">🔍</button><canvas id="cv"></canvas></div>
      <div class="card">
        <h3>💵 היום</h3>
        <div class="pnl" id="pnl"></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="card"><h3>👥 הצוות עכשיו</h3><div class="agents" id="agents"></div></div>
      <div class="card"><h3>📦 לפי מוצר (היום)</h3><div id="byprod"></div></div>
    </section>
    <section class="view" id="view-chat">
      <div id="msgs"></div>
      <div class="typing" id="typing" style="padding:0 14px 6px">🧠 המנהל מקליד…</div>
      <div class="composer"><textarea id="inp" rows="1" placeholder="כתוב למנהל…"></textarea><button id="send">➤</button></div>
    </section>
    <section class="view" id="view-log"><div class="seg" id="logSeg"><button data-f="all" class="on">הכל</button><button data-f="talk">שיחות ופגישות</button><button data-f="manager">המנהל</button></div><div class="feed" id="feed"></div></section>
    <section class="view" id="view-tasks"><div id="tasks"></div></section>
  </main>
  <nav>
    <button data-v="office" class="on"><span>🏢</span>משרד</button>
    <button data-v="chat"><span>💬</span>מנהל<i class="badge" id="chatBadge"></i></button>
    <button data-v="log"><span>📜</span>יומן</button>
    <button data-v="tasks"><span>📋</span>משימות</button>
  </nav>
</div>

<div id="login"><div class="box">
  <div style="font-size:54px">🏢</div><h2>המשרד של הסוכנים</h2>
  <div id="step1"><input id="email" type="email" placeholder="your@email.com" autocomplete="username">
    <input id="pass" type="password" placeholder="סיסמה" autocomplete="current-password" style="direction:ltr"><button id="signin">כניסה</button></div>
  <div class="err" id="err"></div>
</div></div>

<script type="module">
// ======================= data layer =======================
const CFG = window.APP_CONFIG || {};
const DEMO = location.hash === '#demo';
const NOT_CONNECTED = !CFG.SUPABASE_URL && !DEMO;
const S = { status:{}, events:[], messages:[], chat:[], tasks:{}, kv:{}, connected:false };
let sb = null, rerender = () => {};
const AG = {
  manager:{name:'המנהל',emoji:'🧠',shirt:'#8b5cf6',hair:'#2b1b0e',skin:'#f1c27d',seat:{x:336,y:80},face:'up',coffee:{x:330,y:160}},
  researcher:{name:'החוקר',emoji:'🔍',shirt:'#22c55e',hair:'#151515',skin:'#e0ac69',seat:{x:84,y:92},face:'up',coffee:{x:316,y:180}},
  editor:{name:'העורך',emoji:'✏️',shirt:'#3b82f6',hair:'#7c3f00',skin:'#f6d0a8',seat:{x:184,y:92},face:'up',coffee:{x:332,y:182}},
  content:{name:'התוכן',emoji:'📸',shirt:'#ec4899',hair:'#f59e0b',skin:'#f1c27d',seat:{x:84,y:138},face:'down',coffee:{x:348,y:180}},
  campaigner:{name:'הקמפיינר',emoji:'📢',shirt:'#f97316',hair:'#3b2414',skin:'#c68642',seat:{x:184,y:138},face:'down',coffee:{x:364,y:182}},
};
const IDS = Object.keys(AG);
const todayStr = () => new Date().toLocaleDateString('en-CA');

async function startLive(){
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  await loadAll(); subscribe();
}
async function loadAll(){
  const since = new Date(Date.now() - 36*3600e3).toISOString();
  const [st, ev, ms, ch, tk, kv] = await Promise.all([
    sb.from('agent_status').select('*'),
    sb.from('events').select('*').gte('at', since).order('id', {ascending:false}).limit(400),
    sb.from('messages').select('*').gte('at', since).order('id', {ascending:false}).limit(200),
    sb.from('chat').select('*').order('id', {ascending:false}).limit(150),
    sb.from('tasks').select('*').neq('status', 'archived').order('updated_at', {ascending:false}).limit(300),
    sb.from('kv').select('*'),
  ]);
  (st.data||[]).forEach(r => S.status[r.agent] = r);
  S.events = (ev.data||[]).reverse(); S.messages = (ms.data||[]).reverse(); S.chat = (ch.data||[]).reverse();
  (tk.data||[]).forEach(t => S.tasks[t.id] = t);
  (kv.data||[]).forEach(r => S.kv[r.key] = r.value);
  rerender();
}
function subscribe(){
  sb.channel('live')
    .on('postgres_changes', {event:'*', schema:'public', table:'agent_status'}, p => { S.status[p.new.agent] = p.new; rerender(); })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'events'}, p => { S.events.push(p.new); onEvent(p.new); rerender(); })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => { S.messages.push(p.new); rerender(); })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat'}, p => { addChat(p.new); })
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, p => { if (p.new?.id) S.tasks[p.new.id] = p.new; rerender(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'kv'}, p => { if (p.new?.key) S.kv[p.new.key] = p.new.value; rerender(); })
    .subscribe(s => { S.connected = s === 'SUBSCRIBED'; rerender(); if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setTimeout(() => location.reload(), 5000); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });
}
function addChat(m){ if (S.chat.some(c => c.id === m.id)) return;
  const local = S.chat.findIndex(c => String(c.id).startsWith('l') && c.role === m.role && c.text === m.text);
  if (local >= 0) { S.chat[local] = m; return renderChat(); }
  S.chat.push(m); if (m.role === 'manager') typing(false); renderChat(true); if (view !== 'chat' && m.role === 'manager') setBadge(+1); }
async function sendChat(text){
  if (DEMO) return demoReply(text);
  typing(true);
  const { data, error } = await sb.functions.invoke('manager-chat', { body:{ text } });
  if (error){ typing(false); addChat({id:'e'+Date.now(), role:'manager', text:'⚠️ לא הצלחתי לשלוח: ' + error.message, at:new Date().toISOString()}); }
}

// ----- login (6-digit code, works inside the home-screen app) -----
function showLogin(){
  const $l = document.getElementById('login'); $l.style.display = 'grid';
  const err = t => document.getElementById('err').textContent = t || '';
  const go = async () => {
    const email = document.getElementById('email').value.trim(), password = document.getElementById('pass').value;
    if (!email || !password) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return err('אימייל או סיסמה שגויים');
    $l.style.display = 'none'; await loadAll(); subscribe();
  };
  document.getElementById('signin').onclick = go;
  document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

  box.innerHTML = S.chat.map(m => { const q = m.meta?.type === 'question', r = m.meta?.type === 'daily_report';
    return `<div class="m ${m.role} ${q ? 'question' : ''} ${r ? 'report' : ''}">${esc(m.text)}${q ? `<div class="chips"><button>מאשר ✅</button><button>לא עכשיו</button><button>תסביר עוד</button></div>` : ''}<time>${new Date(m.at).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})}</time></div>`; }).join('')
    || '<div class="empty">כתוב למנהל כל דבר: רעיון, הוראה או שאלה.</div>';
  box.querySelectorAll('.chips button').forEach(b => b.onclick = () => submit(b.textContent.replace(/[✅]/g,'').trim()));
  if (scroll || atBottom) box.scrollTop = box.scrollHeight;
}
function renderLog(){
  const rows = [...S.events.map(e => ({at:e.at, who:e.agent, text:(KIND[e.kind] || (e => `${e.kind}`))(e), type:'event'})),
                ...S.messages.map(m => ({at:m.at, who:m.sender, text:`💬 ${AG[m.sender]?.emoji || ''} ${AG[m.sender]?.name || m.sender} ← ${m.recipient === 'team' ? 'הצוות' : (AG[m.recipient]?.name || m.recipient)}: ${m.text}`, type:'talk'}))]
    .filter(r => logFilter === 'all' || (logFilter === 'talk' ? r.type === 'talk' : r.who === 'manager'))
    .sort((a,b) => b.at.localeCompare(a.at)).slice(0, 250);
  $('feed').innerHTML = rows.map(r => `<div class="row"><time>${new Date(r.at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</time><span class="${r.type === 'talk' ? 'msg' : ''}">${esc(r.text)}</span></div>`).join('') || '<div class="empty">אין פעילות עדיין</div>';
}
function renderTasks(){
  const groups = [['🚨 דורש אותך',['escalated','failed']],['⏳ בעבודה',['pending','rework']],['🔍 ממתין לבדיקת המנהל',['done']],['✅ אושר',['approved']]];
  const all = Object.values(S.tasks);
  $('tasks').innerHTML = groups.map(([h,sts]) => { const ts = all.filter(t => sts.includes(t.status)).sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||'')).slice(0, 40);
    return ts.length ? `<div class="card"><h3>${h} <span style="color:var(--mut)">(${ts.length})</span></h3>${ts.map(t => `<div class="task">${AG[t.agent]?.emoji || ''} <b>${esc(t.title)}</b>${t.status === 'rework' ? ' ↩️' : ''}<small>${AG[t.agent]?.name || t.agent} · ${t.updated_at ? new Date(t.updated_at).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'}) : ''}</small></div>`).join('')}</div>` : ''; }).join('')
    || '<div class="empty">אין משימות</div>';
}
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function typing(on){ $('typing').style.display = on ? 'block' : 'none'; if (on) $('msgs').scrollTop = 1e9; }
function submit(text){
  text = (text || '').trim(); if (!text) return;
  addChat({id:'l'+Date.now(), role:'danny', text, at:new Date().toISOString()}); $('inp').value = '';
  sendChat(text);
}
let rq = 0;
rerender = () => { if (rq) return; rq = requestAnimationFrame(() => { rq = 0;
  $('dot').classList.toggle('on', S.connected);
  if (view === 'office') renderOffice(); if (view === 'log') renderLog(); if (view === 'tasks') renderTasks(); }); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  view = b.dataset.v; document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  if (view === 'chat'){ setBadge(0); renderChat(true); } if (view === 'office') setTimeout(resize, 10); rerender(); });
document.querySelectorAll('#logSeg button').forEach(b => b.onclick = () => { logFilter = b.dataset.f; document.querySelectorAll('#logSeg button').forEach(x => x.classList.toggle('on', x === b)); renderLog(); });
$('send').onclick = () => submit($('inp').value);
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit($('inp').value); } });
setInterval(() => { $('clk').textContent = hm(new Date()); }, 1000); $('clk').textContent = hm(new Date());

if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(() => {});
resize(); requestAnimationFrame(frame);
if (NOT_CONNECTED) { document.getElementById('login').style.display = 'grid'; document.querySelector('#login .box').innerHTML = '<div style="font-size:54px">🔌</div><h2>המשרד עוד לא מחובר</h2><p style="color:var(--mut)">ההקמה בתהליך. הדף יתעדכן לבד כשהמסד יחובר.</p>'; }
else if (DEMO) { startDemo(); rerender(); renderChat(); } else startLive().catch(e => { console.error(e); $('dot').style.background = 'var(--bad)'; });
</script>
</body>
</html>
